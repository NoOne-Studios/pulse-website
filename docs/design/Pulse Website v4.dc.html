<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse — website prototype v4 (VitalCare structure match)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&family=Anek+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1F30; --ink-2:#42596E; --ink-3:#7B8FA1;
  --blue:#1268A8; --blue-dk:#0B4C7D; --tint:#E7F1F9; --line-b:#C6DCEE;
  --paper:#F4F9FC; --card:#FFF; --line:#E1EAF2; --line-2:#BFD2E1;
  --sand:#8A5A14; --sand-bg:#FBF3E4; --sand-line:#E7D5B4;
  --scale:1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E3EAF0;font-family:'Anek Latin','Anek Tamil',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body[data-lang="ta"]{font-family:'Anek Tamil','Anek Latin',system-ui,sans-serif}
.rev{background:#08131E;color:#C6D6E3;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;position:sticky;top:0;z-index:90}
.rev strong{color:#fff;font-weight:500}
.rev .grp{display:flex;border:1px solid #2C4459;border-radius:7px;overflow:hidden}
.rev button{background:none;border:0;color:#A6BCCE;font:inherit;padding:6px 11px;cursor:pointer;border-right:1px solid #2C4459}
.rev button:last-child{border-right:0}
.rev button[aria-pressed="true"]{background:#1B3A55;color:#fff}
.rev .note{color:#7B93A8;font-size:12px;margin-left:auto}

.stage{display:flex;justify-content:center;padding:18px 12px 60px}
.frame{--gut:20px;width:100%;max-width:412px;background:var(--card);border:1px solid var(--line-2);
  border-radius:20px;overflow:clip;font-size:calc(16px * var(--scale));position:relative}
.frame[data-vp="desktop"]{--gut:64px;max-width:1200px;font-size:calc(17px * var(--scale))}

/* ---- nav ---- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:9px var(--gut);gap:10px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;font:inherit;cursor:pointer;color:var(--ink);min-height:48px}
.logo .mark{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.78em;font-weight:700}
.logo .wd{font-weight:700;font-size:1.12em;letter-spacing:-.02em}
.icons{display:flex;gap:6px;align-items:center}
.hbtn{min-width:48px;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:999px;font:inherit;font-size:.84em;cursor:pointer;color:var(--ink);padding:0 12px}
.joinbtn{display:none;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:0 20px;min-height:46px;font:inherit;font-size:.9em;font-weight:500;cursor:pointer}
.frame[data-vp="desktop"] .joinbtn{display:block}
.hamb{display:block;width:18px}.hamb span{display:block;height:2px;background:var(--ink);border-radius:2px;margin:4px 0}
nav#menu{display:none;border-top:1px solid var(--line);background:var(--card);padding:4px var(--gut) 10px}
nav#menu.open{display:block}
nav#menu button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;cursor:pointer;color:var(--ink);padding:14px 0;border-bottom:1px solid var(--line);min-height:48px}
nav#menu button:last-child{border-bottom:0}
nav#menu button[aria-current="page"]{color:var(--blue);font-weight:600}
.frame[data-vp="desktop"] #hambtn{display:none}
.frame[data-vp="desktop"] nav#menu{display:flex;gap:2px;padding:0 var(--gut);border-top:0;position:absolute;left:50%;transform:translateX(-50%);top:0}
.frame[data-vp="desktop"] nav#menu button{width:auto;border-bottom:0;padding:0 13px;min-height:64px;font-size:.93em}
.frame[data-vp="desktop"] nav#menu button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--blue)}
.frame[data-vp="desktop"] header{position:sticky}
.frame[data-vp="desktop"] .bar{position:relative;min-height:64px}

/* ---- photo placeholders ---- */
.ph{background:repeating-linear-gradient(135deg,#EDF4FA 0 10px,#E5EEF7 10px 20px);
  border:1px dashed var(--line-2);border-radius:16px;display:flex;flex-direction:column;
  justify-content:flex-end;padding:12px;color:var(--blue-dk);position:relative;overflow:hidden}
.ph b{font-size:.66em;letter-spacing:.12em;font-weight:700;opacity:.65;display:block;margin-bottom:3px}
.ph span{font-size:.78em;line-height:1.4;opacity:.85}
body[data-lang="ta"] .ph b{letter-spacing:.02em;font-size:.72em}

/* ---- sections ---- */
section{padding:56px var(--gut);border-bottom:1px solid var(--line);background:var(--card)}
.frame[data-vp="desktop"] section{padding:104px var(--gut)}
section.tint{background:var(--paper)}
.eyebrow{display:inline-block;font-size:.72em;letter-spacing:.14em;color:var(--blue);font-weight:700;
  border:1px solid var(--line-b);background:var(--tint);padding:6px 14px;border-radius:999px;margin-bottom:18px}
body[data-lang="ta"] .eyebrow{letter-spacing:.02em;font-size:.78em}
h1{font-size:2.3em;line-height:1.1;font-weight:700;letter-spacing:-.028em}
h2{font-size:1.75em;line-height:1.15;font-weight:700;letter-spacing:-.024em;margin-bottom:14px}
.frame[data-vp="desktop"] h2{font-size:3em;max-width:17ch}
h3{font-size:1.06em;font-weight:600;line-height:1.35}
p{font-size:.97em;line-height:1.68;color:var(--ink-2);max-width:58ch}
.lede{font-size:1.05em;margin-top:14px}
.frame[data-vp="desktop"] .lede{font-size:1.2em}

/* ---- hero ---- */
.hero{background:radial-gradient(130% 100% at 20% -10%,#D5E8F7 0%,rgba(213,232,247,0) 62%),
  radial-gradient(90% 70% at 100% 10%,#E3F0FA 0%,rgba(227,240,250,0) 60%),linear-gradient(180deg,#EFF7FC,#FFF);
  padding-top:44px;padding-bottom:0;overflow:hidden}
.frame[data-vp="desktop"] .hero{padding-top:80px}
.bigword{font-size:2.9em;line-height:.94;font-weight:700;letter-spacing:-.045em;color:var(--ink);opacity:.1;white-space:nowrap}
.frame[data-vp="desktop"] .bigword{font-size:7.4em}
.bigword.on{opacity:1}
.herotag{font-size:1.06em;color:var(--ink-2);margin-top:16px;max-width:34ch;line-height:1.55}
.frame[data-vp="desktop"] .herotag{font-size:1.28em}
.since{display:inline-flex;align-items:center;gap:8px;font-size:.82em;color:var(--ink-3);
  border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;margin-top:18px}
.since i{width:6px;height:6px;border-radius:50%;background:var(--blue);font-style:normal}
.heroimg{height:230px;margin-top:26px}
.frame[data-vp="desktop"] .heroimg{height:380px}
.frame[data-vp="desktop"] .herogrid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:end}
.cta{display:inline-block;min-height:54px;padding:15px 26px;border-radius:999px;background:var(--tint);
  border:2px dashed var(--blue);color:var(--blue-dk);font:inherit;font-weight:600;font-size:1em;
  cursor:pointer;text-align:center;line-height:1.4;margin-top:22px;width:100%}
.frame[data-vp="desktop"] .cta{width:auto;min-width:290px}
.cta small{display:block;font-weight:400;font-size:.76em;opacity:.85;margin-top:3px}
.cta.solid{background:var(--ink);border:2px solid var(--ink);color:#fff}
.cta.solid:hover{background:#132C42}
.herofoot{border-top:1px solid var(--line);margin-top:30px;padding:18px 0 34px;display:flex;
  flex-wrap:wrap;gap:10px 22px;align-items:center}
.hf{display:flex;align-items:center;gap:9px;font-size:.86em;color:var(--ink-2);line-height:1.4}
.hf i{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--blue);
  display:grid;place-items:center;font-style:normal;font-size:.8em;flex:none;font-weight:700}

/* ---- checked card (replaces stat card) ---- */
.frame[data-vp="desktop"] .split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.checkcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:22px}
.frame[data-vp="desktop"] .checkcard{margin-top:0}
.checkcard .ph{height:190px;margin-bottom:16px}
.crow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.crow:last-child{border-bottom:0}
.crow i{color:var(--blue);font-style:normal;font-weight:700;flex:none}
.crow span{font-size:.9em;line-height:1.5;color:var(--ink-2)}

/* ---- image trio ---- */
.trio{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.frame[data-vp="desktop"] .trio{grid-template-columns:repeat(3,1fr);gap:16px;margin-top:38px}
.trio .ph:first-child{grid-column:1/-1}
.frame[data-vp="desktop"] .trio .ph:first-child{grid-column:auto}
.trio .ph{height:170px}
.frame[data-vp="desktop"] .trio .ph{height:290px}

/* ---- services grid ---- */
.svcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.frame[data-vp="desktop"] .svcgrid{grid-template-columns:repeat(4,1fr);gap:18px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.svc .ph{border:0;border-radius:0;height:130px}
.frame[data-vp="desktop"] .svc .ph{height:210px}
.svc .body{padding:15px;display:flex;flex-direction:column;gap:6px;flex:1}
.svc p{font-size:.86em;line-height:1.5}
.svc .arrow{align-self:flex-start;margin-top:auto;padding-top:10px;color:var(--blue);font-size:1.1em}
.svc.dark-slot{border:1px dashed var(--blue);background:var(--tint)}
.svc.dark-slot .ph{background:none;border-bottom:1px dashed var(--line-b)}
.slotnote{font-size:.79em;color:var(--blue-dk);line-height:1.45}

/* ---- marquee ---- */
.marq{background:var(--ink);color:#fff;overflow:hidden;padding:16px 0;white-space:nowrap;border-bottom:1px solid var(--line)}
.marq .track{display:inline-flex;gap:30px;padding-left:30px;animation:sl 30s linear infinite;align-items:center}
.marq span{font-size:1.15em;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:30px}
.frame[data-vp="desktop"] .marq span{font-size:1.9em}
.marq span::after{content:"◦";opacity:.5}
@keyframes sl{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---- process ---- */
.pstep{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}
.frame[data-vp="desktop"] .pstep{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:20px}
.pstep .ph{border:0;border-radius:0;height:180px}
.frame[data-vp="desktop"] .pstep .ph{height:100%;min-height:290px}
.pstep .body{padding:20px}
.frame[data-vp="desktop"] .pstep .body{padding:38px}
.pnum{display:inline-flex;align-items:center;gap:8px;font-size:.74em;letter-spacing:.12em;font-weight:700;color:var(--blue);margin-bottom:10px}
body[data-lang="ta"] .pnum{letter-spacing:.02em;font-size:.8em}
.incl{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.incl b{font-size:.72em;letter-spacing:.12em;color:var(--ink-3);font-weight:700;display:block;margin-bottom:9px}
body[data-lang="ta"] .incl b{letter-spacing:.02em;font-size:.78em}
.incl li{list-style:none;font-size:.87em;color:var(--ink-2);display:flex;gap:9px;line-height:1.5;padding:4px 0}
.incl li i{color:var(--blue);font-style:normal;flex:none}

/* ---- founders (replaces team) ---- */
.people{display:grid;gap:14px;margin-top:8px}
.frame[data-vp="desktop"] .people{grid-template-columns:1fr 1fr;gap:24px}
.pcardx{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pcardx .ph{border:0;border-radius:0;height:220px}
.frame[data-vp="desktop"] .pcardx .ph{height:320px}
.pcardx .body{padding:18px}
.role{font-size:.84em;color:var(--ink-3);margin:3px 0 8px}

/* ---- letter (replaces testimonials) ---- */
.letter{background:var(--ink);color:#DCE8F1;border-radius:22px;padding:26px}
.frame[data-vp="desktop"] .letter{padding:56px}
.letter .qm{font-size:2.4em;color:var(--blue);line-height:1;margin-bottom:12px}
.letter p{color:#C3D5E2;font-size:1.05em;line-height:1.65;max-width:60ch}
.frame[data-vp="desktop"] .letter p{font-size:1.25em}
.letter .sig{margin-top:20px;font-size:.88em;color:#8FA9BD}

/* ---- FAQ ---- */
.faq{border-top:1px solid var(--line);margin-top:8px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-size:1em;font-weight:600;
  display:flex;justify-content:space-between;gap:14px;align-items:flex-start;min-height:48px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--blue);font-size:1.3em;line-height:1;flex:none}
.faq details[open] summary::after{content:"−"}
.faq p{padding:0 0 18px;font-size:.93em}

/* ---- comparison ---- */
.cmp{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card);margin-top:8px}
.cmp .hd{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-bottom:1px solid var(--line)}
.cmp .hd div{padding:14px;font-size:.8em;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.cmp .hd div:last-child{border-left:1px solid var(--line);color:var(--blue)}
body[data-lang="ta"] .cmp .hd div{letter-spacing:.02em}
.cmp .row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.cmp .row:last-child{border-bottom:0}
.cmp .row div{padding:14px;font-size:.89em;line-height:1.5;color:var(--ink-3)}
.cmp .row div:last-child{border-left:1px solid var(--line);color:var(--ink);font-weight:500}

/* ---- roles (replaces careers) ---- */
.role-row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:10px}
.frame[data-vp="desktop"] .roles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frame[data-vp="desktop"] .role-row{margin-bottom:0}
.tagline{display:inline-block;font-size:.76em;color:var(--blue);background:var(--tint);
  border-radius:999px;padding:4px 11px;margin-bottom:9px}
.role-row li{list-style:none;font-size:.87em;color:var(--ink-2);display:flex;gap:8px;padding:3px 0;line-height:1.45}
.role-row li i{color:var(--blue);font-style:normal;flex:none}

/* ---- blog ---- */
.posts{display:grid;gap:12px;margin-top:8px}
.frame[data-vp="desktop"] .posts{grid-template-columns:repeat(3,1fr);gap:18px}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:0;width:100%}
.post .ph{border:0;border-radius:0;height:150px}
.post .body{padding:16px}
.post .meta{font-size:.78em;color:var(--ink-3);margin-top:9px}

/* ---- big CTA band ---- */
.band{background:radial-gradient(120% 120% at 50% 0%,#14405F 0%,#0B1F30 70%);color:#fff;
  text-align:center;padding:56px var(--gut);border-bottom:1px solid var(--line);overflow:hidden}
.frame[data-vp="desktop"] .band{padding:110px var(--gut)}
.band .bigword{color:#fff;opacity:.09}
.band h2{color:#fff;margin:18px auto 0;max-width:20ch}
.band .cta{background:#fff;border:2px solid #fff;color:var(--ink)}
.band .ph{height:150px;margin-top:30px;background:repeating-linear-gradient(135deg,#153A57 0 10px,#12324B 10px 20px);border-color:#2A506E;color:#9FC2DC}
.frame[data-vp="desktop"] .band .ph{height:260px}

/* ---- contact ---- */
.frame[data-vp="desktop"] .csplit{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start}
.cinfo{margin-top:20px}
.cinfo .lbl{font-size:.74em;letter-spacing:.12em;color:var(--ink-3);font-weight:700;display:block;margin:18px 0 8px}
body[data-lang="ta"] .cinfo .lbl{letter-spacing:.02em;font-size:.8em}
.cinfo a,.cinfo span.v{display:block;font-size:.98em;color:var(--ink);line-height:1.5}
.contactbtn{display:flex;align-items:center;gap:12px;padding:15px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;margin-bottom:10px;width:100%;text-align:left;
  font:inherit;cursor:pointer;min-height:56px;color:var(--ink)}
.contactbtn .g{width:38px;height:38px;border-radius:11px;background:var(--tint);color:var(--blue);display:grid;place-items:center;flex:none}
.contactbtn .lbl2{font-size:.78em;color:var(--ink-3);display:block}
.contactbtn .val{font-size:.95em;font-weight:600}
.fs{border:0;margin:0 0 20px;padding:0}
.lg{font-size:.98em;font-weight:600;margin-bottom:12px;color:var(--ink)}
.pgrid{display:grid;gap:10px}
.frame[data-vp="desktop"] .pgrid{grid-template-columns:1fr 1fr}
.pers{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:16px;min-height:58px;cursor:pointer;font:inherit;color:var(--ink)}
.pers.on{border-color:var(--blue);background:var(--tint);box-shadow:inset 0 0 0 1px var(--blue)}
.pers .pl{font-weight:600;font-size:.95em;line-height:1.4}
.pers .ph2{font-size:.83em;color:var(--ink-3);line-height:1.4}
.pers.on .ph2{color:var(--blue-dk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:12px 16px;
  min-height:48px;cursor:pointer;font:inherit;font-size:.9em;color:var(--ink)}
.chip.on{border-color:var(--blue);background:var(--tint);color:var(--blue-dk);font-weight:600}
.fl{display:block;font-size:.87em;color:var(--ink-2);margin:14px 0 6px}
.fi{width:100%;font:inherit;font-size:1em;color:var(--ink);background:var(--card);
  border:1px solid var(--line-2);border-radius:12px;padding:13px 15px;min-height:50px}
.fi:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
textarea.fi{resize:vertical;line-height:1.5}
.fh{font-size:.84em;line-height:1.55;color:var(--sand);background:var(--sand-bg);border:1px solid var(--sand-line);
  border-radius:12px;padding:12px 15px;margin-top:14px}
.done{background:var(--tint);border:1px solid var(--blue);border-radius:16px;padding:20px}
.done-t{font-weight:700;color:var(--blue-dk);font-size:1.05em;margin-bottom:6px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:.87em;line-height:1.6;color:var(--ink-2);margin-top:18px;max-width:62ch}
.note.open{background:var(--sand-bg);border-color:var(--sand-line);color:var(--sand)}
ul.plain{list-style:none;display:flex;flex-direction:column;gap:11px;margin-top:6px;max-width:60ch}
ul.plain li{display:flex;gap:10px;font-size:.93em;line-height:1.55;color:var(--ink-2)}
ul.plain li i{color:var(--blue);font-style:normal;font-weight:700;flex:none}
.back{background:none;border:0;font:inherit;color:var(--blue);cursor:pointer;padding:10px 0;min-height:48px}

/* ---- footer ---- */
footer{background:var(--ink);color:#93AABD;padding:38px var(--gut) 26px}
.nl{border-bottom:1px solid #24405A;padding-bottom:26px;margin-bottom:24px}
.nl h4{color:#fff;font-size:1.15em;font-weight:600;margin-bottom:12px;letter-spacing:-.01em}
.nlrow{display:flex;gap:8px;flex-wrap:wrap}
.nlrow input{flex:1;min-width:180px;min-height:50px;border-radius:12px;border:1px solid #2C4A66;
  background:#132C42;color:#fff;padding:12px 15px;font:inherit}
.nlrow button{min-height:50px;border-radius:12px;border:0;background:#fff;color:var(--ink);
  font:inherit;font-weight:600;padding:0 22px;cursor:pointer}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.frame[data-vp="desktop"] .fgrid{grid-template-columns:repeat(3,1fr)}
footer h5{font-size:.74em;letter-spacing:.12em;color:#6D89A1;font-weight:700;margin-bottom:10px}
body[data-lang="ta"] footer h5{letter-spacing:.02em;font-size:.8em}
footer button.fl2{display:block;background:none;border:0;font:inherit;color:#CFDEE9;padding:9px 0;
  cursor:pointer;text-align:left;min-height:44px;font-size:.92em}
footer button.fl2:hover{color:#fff;text-decoration:underline}
footer .val2{font-size:.92em;color:#CFDEE9;line-height:1.6;display:block;padding:3px 0}
.legal{border-top:1px solid #24405A;margin-top:24px;padding-top:18px;font-size:.85em;line-height:1.6;color:#6D89A1;max-width:72ch}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s cubic-bezier(.19,1,.22,1)}
.rv.in{opacity:1;transform:none}

P.contact=function(){var l=L(),f=state.form;
 var head='<section class="hero" style="padding-bottom:48px"><span class="eyebrow">'+["[ CONTACT ]","[ தொடர்பு ]"][l]+
  '</span><h1>'+["Tell us who you are and we will come back to you.","நீங்கள் யார் என்று சொல்லுங்கள்."][l]+
  '</h1><p class="lede">'+["A few short questions so the right person answers.","சரியான நபர் பதிலளிக்க சில கேள்விகள்."][l]+'</p></section>';
 var tail='<section class="tint"><span class="eyebrow">'+["[ OR REACH US DIRECTLY ]","[ நேரடித் தொடர்பு ]"][l]+'</span>'+
  '<button class="contactbtn"><span class="g">✆</span><span><span class="lbl2">WhatsApp</span><span class="val">+91 00000 00000</span></span></button>'+
  '<button class="contactbtn"><span class="g">☏</span><span><span class="lbl2">'+["Phone","தொலைபேசி"][l]+'</span><span class="val">+91 00000 00000</span></span></button>'+
  '<button class="contactbtn"><span class="g">✉</span><span><span class="lbl2">'+["Email","மின்னஞ்சல்"][l]+'</span><span class="val">hello@pulse.example</span></span></button>'+
  '<p class="note open">'+["In an emergency do not use this page. Call 108.","அவசரநிலையில் 108-ஐ அழைக்கவும்."][l]+'</p></section>';
 if(f.sent) return head+'<section><div class="done"><p class="done-t">'+["Thank you — we have your details.","நன்றி — விவரங்கள் கிடைத்தன."][l]+
  '</p><p>'+["Someone will reply on the number you gave.","நீங்கள் அளித்த எண்ணுக்குப் பதில் வரும்."][l]+'</p></div>'+
  '<p class="note open">'+["Prototype only — nothing was sent or stored.","மாதிரி மட்டுமே."][l]+'</p>'+
  '<button class="back" data-formreset>'+["Start again","மீண்டும்"][l]+'</button></section>'+tail;
 var body='<section><fieldset class="fs"><legend class="lg">'+["Who is getting in touch?","யார் தொடர்பு கொள்கிறார்கள்?"][l]+'</legend><div class="pgrid">'+
  FORM.personas.map(function(p){var on=f.persona===p.id?" on":"";
   return '<button class="pers'+on+'" data-persona="'+p.id+'" aria-pressed="'+(on?"true":"false")+'"><span class="pl">'+p.label[l]+'</span><span class="ph2">'+p.hint[l]+'</span></button>'}).join("")+'</div></fieldset>';
 if(f.persona){
  body+=FORM.q[f.persona].map(function(q){return '<fieldset class="fs"><legend class="lg">'+q.label[l]+'</legend><div class="chips">'+
   q.o().map(function(o,i){var s=f.ans[q.k]===i?" on":"";
    return '<button class="chip'+s+'" data-q="'+q.k+'" data-i="'+i+'" aria-pressed="'+(s?"true":"false")+'">'+o[l]+'</button>'}).join("")+'</div></fieldset>'}).join("");
  body+='<fieldset class="fs"><legend class="lg">'+["How do we reach you?","உங்களை எப்படித் தொடர்புகொள்வது?"][l]+'</legend>'+
   '<label class="fl" for="fn">'+["Your name","உங்கள் பெயர்"][l]+'</label><input class="fi" id="fn" type="text" autocomplete="name">'+
   '<label class="fl" for="fp">'+["Mobile number","கைபேசி எண்"][l]+'</label><input class="fi" id="fp" type="tel" inputmode="numeric" autocomplete="tel">'+
   '<label class="fl" for="fx">'+["Anything else? (optional)","வேறு ஏதேனும்? (விருப்பம்)"][l]+'</label><textarea class="fi" id="fx" rows="3"></textarea>'+
   '<p class="fh">'+["Please do not write medical details, test results, or anything about the patient’s condition here.","மருத்துவ விவரங்களை இங்கு எழுத வேண்டாம்."][l]+'</p></fieldset>'+
   '<button class="cta solid" data-formsend style="width:100%">'+["Send","அனுப்பு"][l]+'</button>';
  if(f.persona==="support") body+='<p class="note open">'+["If someone is unwell right now, do not wait. Call 108.","இப்போது உடல்நலமின்றி இருந்தால் 108."][l]+'</p>';
 }
 return head+body+'</section>'+tail;
};

var io;
function wire(){if(io)io.disconnect();
 io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.1});
 document.querySelectorAll("#view .rv").forEach(function(el){io.observe(el)})}

 document.getElementById("menu").innerHTML=ORDER.map(function(k){

  return '<button type="button" data-go="'+k+'"'+c+'>'+T.nav[k][l]+'</button>'}).join("");
 document.getElementById("langtoggle").textContent=l===0?"தமிழ்":"English";
 document.getElementById("joinbtn").textContent=T.nav.contact[l];}

function render(f){document.body.setAttribute("data-lang",L()===0?"en":"ta");
 document.documentElement.lang=L()===0?"en":"ta";
 var v=document.getElementById("view");v.innerHTML=(P[state.page]||P.home)();
 renderNav();renderFoot();wire();
 if(f){v.scrollIntoView({block:"start"});v.focus({preventScroll:true})}}
function go(p){state.page=p;document.getElementById("menu").classList.remove("open");
 document.getElementById("hambtn").setAttribute("aria-expanded","false");render(true)}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-go]");if(t){go(t.getAttribute("data-go"));return}
 var a=e.target.closest("[data-article]");if(a){state.article=+a.getAttribute("data-article");go("article");return}
 var p=e.target.closest("[data-persona]");if(p){state.form.persona=p.getAttribute("data-persona");state.form.ans={};render(false);return}
 var c=e.target.closest("[data-q]");if(c){state.form.ans[c.getAttribute("data-q")]=+c.getAttribute("data-i");render(false);return}
 if(e.target.closest("[data-formsend]")){state.form.sent=true;render(false);return}
 if(e.target.closest("[data-formreset]")){state.form={persona:null,ans:{},sent:false};render(false);return}
 if(e.target.closest("[data-cta]")){alert(L()===0?"Primary CTA — destination not decided.\n\nWaitlist, app store link, or a static “launching soon” panel.":"முதன்மை CTA — இலக்கு முடிவாகவில்லை.")}});
document.getElementById("hambtn").addEventListener("click",function(){
 var m=document.getElementById("menu"),o=m.classList.toggle("open");this.setAttribute("aria-expanded",o?"true":"false")});
document.getElementById("langtoggle").addEventListener("click",function(){state.lang=L()===0?1:0;sync();render(false)});
function sync(){document.querySelectorAll("[data-lang-btn]").forEach(function(b){
 b.setAttribute("aria-pressed",(b.getAttribute("data-lang-btn")==="en")===(L()===0)?"true":"false")})}
document.querySelectorAll("[data-lang-btn]").forEach(function(b){b.addEventListener("click",function(){
 state.lang=b.getAttribute("data-lang-btn")==="en"?0:1;sync();render(false)})});
document.querySelectorAll(".rev [data-vp]").forEach(function(b){b.addEventListener("click",function(){
 document.getElementById("frame").setAttribute("data-vp",b.getAttribute("data-vp"));
 document.querySelectorAll(".rev [data-vp]").forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false")})})});
document.querySelectorAll("[data-scale]").forEach(function(b){b.addEventListener("click",function(){
 document.documentElement.style.setProperty("--scale",b.getAttribute("data-scale"));
 document.querySelectorAll("[data-scale]").forEach(function(o){o.setAttribute("aria-pressed",o===b?"true":"false")})})});
document.getElementById("doctog").addEventListener("click",function(){
 var on=this.getAttribute("aria-pressed")==="true";this.setAttribute("aria-pressed",on?"false":"true");
 document.getElementById("frame").setAttribute("data-doc",on?"dark":"live");state.form.ans={};render(false)});
document.getElementById("motion").addEventListener("click",function(){
 var on=this.getAttribute("aria-pressed")==="true";this.setAttribute("aria-pressed",on?"false":"true");
 var s=document.getElementById("rm");
 if(on){if(s)s.remove()}else{s=document.createElement("style");s.id="rm";
  s.textContent=".rv{opacity:1!important;transform:none!important;transition:none!important}.marq .track{animation:none}";
  document.head.appendChild(s)}});
sync();render(false);
</script>
